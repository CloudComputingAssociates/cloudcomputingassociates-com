[build]
  command = "npm run build"
  publish = "dist/cloudcomputingassociates-com/browser"

# No SPA catch-all redirect: every route is prerendered to static HTML, so
# Netlify serves each page directly. Unmatched URLs fall through to the
# generated 404.html with a real 404 status (good for SEO) instead of being
# rewritten to the home page with a 200.
