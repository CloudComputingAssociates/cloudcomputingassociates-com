<footer class="footer bg-slate-950 relative text-gray-200 dark:text-gray-200">    
    <div class="container">
        <div class="grid grid-cols-12">
            <div class="col-span-12">
                <div class="py-[60px] px-0">                    
                    <div class="grid grid-cols-1">
                        <div class="text-center">
                            <img [src]="'/assets/images/logo-transparent.png'" class="block mx-auto" alt="">
                        </div>

                        <ul class="list-none footer-list text-center mt-8">
                            <li class="inline px-2"><a [routerLink]="'/services'" class="text-gray-300 hover:text-gray-400 duration-500 ease-in-out">Services</a></li>
                            <li class="inline px-2 mt-[10px]"><a [routerLink]="'/aboutus'" class="text-gray-300 hover:text-gray-400 duration-500 ease-in-out ms-2">About Us</a></li>
                            <li class="inline px-2 mt-[10px]"><a [routerLink]="'/insights'" class="text-gray-300 hover:text-gray-400 duration-500 ease-in-out ms-2">Insights</a></li>
                            <li class="inline px-2 mt-[10px]"><a [routerLink]="'/contactus'" class="text-gray-300 hover:text-gray-400 duration-500 ease-in-out ms-2">Contact Us</a></li>
                        </ul>

                        <ul class="list-none text-center mt-4 flex flex-wrap justify-center gap-x-4 gap-y-1">
                            <li *ngFor="let s of servicePages" class="inline">
                                <a [routerLink]="['/services', s.slug]" class="text-sm text-gray-400 hover:text-gray-300 duration-500 ease-in-out">{{s.title}}</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="py-[30px] px-0 border-t border-slate-800">
        <div class="container text-center">
            <div class="grid md:grid-cols-12 items-center">
                <div class="md:col-span-6">
                    <div class="md:text-start text-center">
                        <p class="text-gray-400">© {{year}} Cloud Computing Associates.</p>
                    </div>
                </div>

                <div class="md:col-span-6 md:mt-0 mt-8">
                    <ul class="list-none md:text-end text-center">
                        <li class="inline me-1"><a href="https://www.linkedin.com/company/cloud-computing-associates" target="_blank" class="h-8 w-8 inline-flex items-center text-center justify-center text-base font-normal tracking-wide align-middle transition duration-500 ease-in-out border border-gray-800 rounded-md hover:border-violet-600 dark:hover:border-violet-600 hover:bg-violet-600 dark:hover:bg-violet-600"><i class="uil uil-linkedin" title="Linkedin"></i></a></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</footer>
