<app-navbar-full/>

<section class="pt-24 md:pt-32 pb-8 w-full table relative bg-[url('/assets/images/bg/bg-5.jpg')] bg-bottom bg-no-repeat" id="home">
    <div class="absolute inset-0 bg-slate-950/80"></div>

    <div class="container">
        <div class="grid grid-cols-1 text-center">
            <h3 class="font-medium leading-normal text-3xl text-white">Contact Us</h3>
        </div>
    </div>
</section>

<section class="relative lg:py-12 py-10">
    <div class="container">
        <div class="grid md:grid-cols-12 grid-cols-1 items-center gap-[30px]">
            <div class="lg:col-span-7 md:col-span-6">
                <img [src]="'/assets/images/contact.svg'" alt="">
            </div>

            <div class="lg:col-span-5 md:col-span-6">
                <div class="lg:ms-5">
                    <div class="bg-white dark:bg-slate-900 rounded-md shadow-sm dark:shadow-gray-700 p-6">
                        <h3 class="mb-6 text-2xl leading-normal font-medium">Ready to get started?</h3>

                        <p *ngIf="serviceTitle" class="mb-5 text-sm font-medium text-violet-600">Regarding: {{serviceTitle}}</p>

                        <div *ngIf="submitted" class="p-4 rounded bg-green-600/10 text-green-600 border border-green-600/20">
                            Thank you. We'll respond within one business day.
                        </div>

                        <div *ngIf="error" class="mb-4 p-4 rounded bg-red-600/10 text-red-600 border border-red-600/20">
                            Sorry, your message couldn't be sent. Please try again in a moment.
                        </div>

                        <form *ngIf="!submitted" name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" (ngSubmit)="onSubmit(contactForm)" #contactForm="ngForm">
                            <input type="hidden" name="form-name" value="contact">
                            <input type="hidden" name="service" [ngModel]="serviceTitle">
                            <p class="hidden">
                                <label>Don't fill this out if you're human: <input name="bot-field" ngModel></label>
                            </p>
                            <div class="grid lg:grid-cols-12 lg:gap-6">
                                <div class="lg:col-span-6 mb-5">
                                    <label for="name" class="form-label font-medium">Your Name:</label>
                                    <input name="name" id="name" type="text" ngModel required class="form-input w-full py-2 px-3 h-10 bg-transparent border border-gray-200 dark:border-gray-800 dark:bg-slate-900 dark:text-slate-200 rounded outline-none focus:border-violet-600/50 dark:focus:border-violet-600/50 focus:ring-0 mt-2" placeholder="Name :">
                                </div>

                                <div class="lg:col-span-6 mb-5">
                                    <label for="email" class="form-label font-medium">Your Email:</label>
                                    <input name="email" id="email" type="email" ngModel required class="form-input w-full py-2 px-3 h-10 bg-transparent border border-gray-200 dark:border-gray-800 dark:bg-slate-900 dark:text-slate-200 rounded outline-none focus:border-violet-600/50 dark:focus:border-violet-600/50 focus:ring-0 mt-2" placeholder="Email :">
                                </div>
                            </div>

                            <div class="grid grid-cols-1">
                                <div class="mb-5">
                                    <label for="company" class="form-label font-medium">Your Company:</label>
                                    <input name="company" id="company" ngModel class="form-input w-full py-2 px-3 h-10 bg-transparent border border-gray-200 dark:border-gray-800 dark:bg-slate-900 dark:text-slate-200 rounded outline-none focus:border-violet-600/50 dark:focus:border-violet-600/50 focus:ring-0 mt-2" placeholder="Company :">
                                </div>

                                <div class="mb-5">
                                    <label for="message" class="form-label font-medium">Your Message:</label>
                                    <textarea name="message" id="message" ngModel required class="form-input w-full py-2 px-3 bg-transparent border border-gray-200 dark:border-gray-800 dark:bg-slate-900 dark:text-slate-200 rounded outline-none focus:border-violet-600/50 dark:focus:border-violet-600/50 focus:ring-0 mt-2 textarea h-28" placeholder="Message :"></textarea>
                                </div>
                            </div>
                            <button type="submit" id="submit" name="send" class="py-2 px-5 inline-block font-normal tracking-wide border align-middle transition duration-500 ease-in-out text-base text-center bg-violet-600 hover:bg-violet-700 border-violet-600 hover:border-violet-700 text-white rounded-md">Send Message</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container lg:mt-24 mt-16">
        <div class="grid grid-cols-1">
            <div class="text-center px-6">
                <div class="relative overflow-hidden text-transparent -m-3">
                    <i data-feather="hexagon" class="h-28 w-28 fill-violet-600/5 mx-auto rotate-[30deg]"></i>
                    <div class="absolute top-2/4 -translate-y-2/4 start-0 end-0 mx-auto text-violet-600 rounded-xl transition-all duration-500 ease-in-out text-4xl flex align-middle justify-center items-center">
                        <i class="uil uil-map-marker"></i>
                    </div>
                </div>

                <div class="content mt-7">
                    <h5 class="title h5 text-xl font-medium">Location</h5>

                    <div class="mt-5">
                        <p class="text-slate-400">Portland, Oregon · Serving clients nationwide</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<app-footer/>
