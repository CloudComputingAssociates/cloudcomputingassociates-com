<app-navbar-full/>

<section class="pt-24 md:pt-32 pb-8 w-full table relative bg-[url('/assets/images/bg/bg-5.jpg')] bg-bottom bg-no-repeat" id="home">
    <div class="absolute inset-0 bg-slate-950/80"></div>

    <div class="container">
        <div class="grid grid-cols-1 text-center">
            <h1 class="font-medium leading-normal text-3xl text-white">{{ article ? article.title : 'Article not found' }}</h1>
        </div>
    </div>
</section>

<section class="relative md:py-24 py-16">
    <div class="container">
        <div class="max-w-3xl mx-auto">
            <ng-container *ngIf="article; else missing">
                <p class="text-slate-400 text-sm mb-8">{{ article.date | date:'MMMM d, y' }} · {{ article.author }}</p>
                <div class="insight-body text-slate-500 dark:text-slate-300" [innerHTML]="article.bodyHtml"></div>
                <div class="mt-10">
                    <a [routerLink]="'/insights'" class="text-violet-600 hover:text-violet-700 transition duration-500 ease-in-out">← Back to Insights</a>
                </div>
            </ng-container>
            <ng-template #missing>
                <p class="text-center text-slate-400">The article you are looking for does not exist.</p>
                <div class="text-center mt-8">
                    <a [routerLink]="'/insights'" class="text-violet-600 hover:text-violet-700">Back to Insights</a>
                </div>
            </ng-template>
        </div>
    </div>
</section>

<app-footer/>
