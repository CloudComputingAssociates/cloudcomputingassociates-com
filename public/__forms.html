<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Netlify form detection</title>
</head>
<body>
  <!-- Standalone form so Netlify reliably detects the "contact" form at deploy time.
       This page is not linked anywhere; it exists only for Netlify's build-time scanner. -->
  <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact" />
    <input type="text" name="service" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="text" name="company" />
    <textarea name="message"></textarea>
    <input name="bot-field" />
  </form>
</body>
</html>
